name: Build Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Source Code
        run: unzip AutoBuilder-1.0.0-NoKey-Source.zip -d .

      - name: Fix Mappings and Build File
        run: |
          cd AutoBuilder-NoKey-Source
          # Tạo lại file mappings có cột 'named' để sửa lỗi
          printf "tiny\t2\t0\tofficial\tintermediary\tnamed\n" > empty-mappings.tiny
          
          # Ghi đè file build.gradle.kts để ép dùng file mappings mới và Java 21
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("fabric-loom") version "1.9.2"
          }
          version = "1.0.0"
          group = "com.autobuildfarm"
          repositories { mavenCentral() }
          dependencies {
              minecraft("com.mojang:minecraft:1.21.4")
              mappings(files("empty-mappings.tiny"))
              modImplementation("net.fabricmc:fabric-loader:0.16.10")
              modImplementation("net.fabricmc.fabric-api:fabric-api:0.119.2+1.21.4")
              modCompileOnly(files("libs/baritone-api-fabric-1.10.2.jar"))
          }
          tasks.withType<JavaCompile>().configureEach { options.release.set(21) }
          tasks.matching { it.name == "remapJar" || it.name == "remapSourcesJar" }.configureEach { enabled = false }
          EOF

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission
        run: |
          cd AutoBuilder-NoKey-Source
          chmod +x gradlew

      - name: Build with Gradle
        run: |
          cd AutoBuilder-NoKey-Source
          ./gradlew build --no-daemon

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Output
          path: AutoBuilder-NoKey-Source/build/libs/*.jar
