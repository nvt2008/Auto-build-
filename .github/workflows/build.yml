name: Build Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      _JAVA_OPTIONS: "-Dfile.encoding=UTF-8 --add-modules=jdk.zipfs"
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and Setup
        run: |
          # Giải nén
          unzip AutoBuilder-1.0.0-NoKey-Source.zip -d extracted
          
          # Tìm thư mục chứa file gradlew và di chuyển vào trong đó
          cd extracted
          if [ -f "AutoBuilder-NoKey-Source/gradlew" ]; then
            cd AutoBuilder-NoKey-Source
          elif [ -d "*/gradlew" ]; then
            cd */ 
          fi
          
          # Ép Gradle sử dụng đúng Java 21 của GitHub Actions
          echo "org.gradle.java.home=$JAVA_HOME" > gradle.properties
          echo "org.gradle.jvmargs=-Xmx3G --add-modules=jdk.zipfs" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          
          # Sửa lại file mappings (thêm cột named)
          printf "tiny\t2\t0\tofficial\tintermediary\tnamed\n" > empty-mappings.tiny

          # Ghi đè file build.gradle.kts
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("fabric-loom") version "1.9.2"
          }
          version = "1.0.0"
          group = "com.autobuildfarm"
          repositories { mavenCentral() }
          dependencies {
              minecraft("com.mojang:minecraft:1.21.4")
              mappings(files("empty-mappings.tiny"))
              modImplementation("net.fabricmc:fabric-loader:0.16.10")
              modImplementation("net.fabricmc.fabric-api:fabric-api:0.119.2+1.21.4")
              modCompileOnly(files("libs/baritone-api-fabric-1.10.2.jar"))
          }
          tasks.withType<JavaCompile>().configureEach { options.release.set(21) }
          tasks.matching { it.name == "remapJar" || it.name == "remapSourcesJar" }.configureEach { enabled = false }
          EOF
          
          # Cấp quyền và chạy build
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Output
          path: |
            extracted/**/build/libs/*.jar
            extracted/build/libs/*.jar
