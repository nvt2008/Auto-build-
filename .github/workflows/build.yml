name: Build Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "--add-modules=jdk.zipfs"
      _JAVA_OPTIONS: "-Dfile.encoding=UTF-8 --add-modules=jdk.zipfs"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Clone and Build
        run: |
          git clone https://gitlab.com/nguyenviettien8d2008/auto-build.git source
          cd source
          
          rm -rf .gradle build libs
          mkdir -p libs
          wget -q https://github.com/cabaletta/baritone/releases/download/v1.10.2/baritone-api-fabric-1.10.2.jar -O libs/baritone-api-fabric-1.10.2.jar
          
          # Tạo file mappings rỗng chuẩn xác bằng Python
          python3 -c "open('empty-mappings.tiny', 'w').write('tiny\t2\t0\tofficial\tnamed\n')"
          
          echo "org.gradle.jvmargs=-Xmx3G --add-modules=jdk.zipfs" > gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("fabric-loom") version "1.9.2"
          }
          version = "1.0.0"
          group = "com.autobuildfarm"
          repositories { mavenCentral() }
          dependencies {
              minecraft("com.mojang:minecraft:1.21.4")
              mappings(files("empty-mappings.tiny"))
              modImplementation("net.fabricmc:fabric-loader:0.16.10")
              modImplementation("net.fabricmc.fabric-api:fabric-api:0.119.2+1.21.4")
              compileOnly(files("libs/baritone-api-fabric-1.10.2.jar"))
          }
          tasks.withType<JavaCompile>().configureEach { options.release.set(21) }
          tasks.matching { it.name == "remapJar" || it.name == "remapSourcesJar" }.configureEach { enabled = false }
          EOF
          
          sed -i 's/gradle-.*-bin.zip/gradle-8.12-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Output
          path: source/build/libs/*.jar
