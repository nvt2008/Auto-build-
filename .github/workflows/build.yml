name: Build Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java 21 via Apt
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk

      - name: Unzip and Setup
        run: |
          unzip AutoBuilder-1.0.0-NoKey-Source.zip -d extracted
          cd extracted/AutoBuilder-NoKey-Source
          
          # Xóa sạch mọi cache cũ
          rm -rf .gradle build
          
          # Ép cấu hình Gradle
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          export JAVA_TOOL_OPTIONS="--add-modules=jdk.zipfs"
          
          echo "org.gradle.java.home=$JAVA_HOME" > gradle.properties
          echo "org.gradle.jvmargs=-Xmx3G --add-modules=jdk.zipfs" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          
          # Ghi đè file build.gradle.kts sử dụng Yarn mappings
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("fabric-loom") version "1.9.2"
          }
          version = "1.0.0"
          group = "com.autobuildfarm"
          repositories { mavenCentral() }
          dependencies {
              minecraft("com.mojang:minecraft:1.21.4")
              mappings("net.fabricmc:yarn:1.21.4+build.8:v2")
              modImplementation("net.fabricmc:fabric-loader:0.16.10")
              modImplementation("net.fabricmc.fabric-api:fabric-api:0.119.2+1.21.4")
              modCompileOnly(files("libs/baritone-api-fabric-1.10.2.jar"))
          }
          tasks.withType<JavaCompile>().configureEach { options.release.set(21) }
          EOF
          
          # Nâng cấp Gradle wrapper lên 8.12
          sed -i 's/gradle-.*-bin.zip/gradle-8.12-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Output
          path: extracted/AutoBuilder-NoKey-Source/build/libs/*.jar
