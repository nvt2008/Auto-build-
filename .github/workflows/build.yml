name: Build Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "--add-modules=jdk.zipfs"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Clone and Auto-Convert
        run: |
          git clone https://gitlab.com/nguyenviettien8d2008/auto-build.git source
          cd source
          
          rm -rf .gradle build libs
          mkdir -p libs
          wget -q https://github.com/cabaletta/baritone/releases/download/v1.10.2/baritone-api-fabric-1.10.2.jar -O libs/baritone-api-fabric-1.10.2.jar
          
          # Cấu hình gradle.properties (Dùng tham số hợp lệ)
          echo "org.gradle.jvmargs=-Xmx3G --add-modules=jdk.zipfs" > gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          
          # CHẠY SCRIPT PYTHON CHUYỂN ĐỔI CODE TỪ INTERMEDIARY SANG YARN
          python3 << 'PYEOF'
          import os, re, urllib.request, zipfile
          
          url = "https://maven.fabricmc.net/net/fabricmc/yarn/1.21.4+build.8/yarn-1.21.4+build.8-v2.jar"
          urllib.request.urlretrieve(url, "yarn.jar")
          with zipfile.ZipFile("yarn.jar", "r") as z:
              z.extractall("yarn_mappings")
              
          mapping_dict = {}
          with open("yarn_mappings/mappings/mappings.tiny", "r") as f:
              for line in f:
                  parts = line.strip().split("\t")
                  if len(parts) >= 3 and parts[1] == "class":
                      inter = None
                      named = None
                      for p in parts:
                          if p.startswith("class_"):
                              inter = p
                          elif p.startswith("net/minecraft"):
                              named = p
                      if inter and named:
                          mapping_dict[inter] = named
          
          for root, dirs, files in os.walk("src"):
              for file in files:
                  if file.endswith(".java"):
                      path = os.path.join(root, file)
                      with open(path, "r", encoding="utf-8") as f:
                          content = f.read()
                      
                      for inter, named in mapping_dict.items():
                          named_pkg = named.replace("/", ".")
                          content = re.sub(r'import net\.minecraft\.' + inter + r'\s*;', f'import {named_pkg};', content)
                          content = re.sub(r'import ' + inter + r'\s*;', f'import {named_pkg};', content)
                          short_name = named.split("/")[-1]
                          content = re.sub(r'\b' + inter + r'\b', short_name, content)
                          
                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)
          print("Đã chuyển đổi code Java thành công!")
          PYEOF
          
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("fabric-loom") version "1.9.2"
          }
          version = "1.0.0"
          group = "com.autobuildfarm"
          repositories { mavenCentral() }
          dependencies {
              minecraft("com.mojang:minecraft:1.21.4")
              mappings("net.fabricmc:yarn:1.21.4+build.8:v2")
              modImplementation("net.fabricmc:fabric-loader:0.16.10")
              modImplementation("net.fabricmc.fabric-api:fabric-api:0.119.2+1.21.4")
              compileOnly(files("libs/baritone-api-fabric-1.10.2.jar"))
          }
          tasks.withType<JavaCompile>().configureEach { options.release.set(21) }
          EOF
          
          sed -i 's/gradle-.*-bin.zip/gradle-8.12-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Output
          path: source/build/libs/*.jar
