name: Build Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Unzip and Clean up
        run: |
          unzip AutoBuilder-1.0.0-NoKey-Source.zip -d extracted
          cd extracted/AutoBuilder-NoKey-Source
          
          # XÓA CACHE RÁC TỪ FILE ZIP CỦA ANDROID
          rm -rf .gradle
          rm -rf build
          rm -rf ~/.gradle/caches
          
          # Tạo file mappings chuẩn bằng Python (đảm bảo đúng dấu Tab)
          python3 -c "open('empty-mappings.tiny', 'w').write('tiny\t2\t0\tofficial\tintermediary\tnamed\n')"
          
          # Ghi đè file cấu hình build
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("fabric-loom") version "1.9.2"
          }
          version = "1.0.0"
          group = "com.autobuildfarm"
          repositories { mavenCentral() }
          dependencies {
              minecraft("com.mojang:minecraft:1.21.4")
              mappings(files("empty-mappings.tiny"))
              modImplementation("net.fabricmc:fabric-loader:0.16.10")
              modImplementation("net.fabricmc.fabric-api:fabric-api:0.119.2+1.21.4")
              modCompileOnly(files("libs/baritone-api-fabric-1.10.2.jar"))
          }
          tasks.withType<JavaCompile>().configureEach { options.release.set(21) }
          tasks.matching { it.name == "remapJar" || it.name == "remapSourcesJar" }.configureEach { enabled = false }
          EOF
          
          chmod +x gradlew
          
          # Thêm biến môi trường _JAVA_OPTIONS để diệt lỗi Provider jar
          export _JAVA_OPTIONS="-Dfile.encoding=UTF-8 --add-modules=jdk.zipfs"
          
          ./gradlew clean build --no-daemon

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: Mod-Output
          path: extracted/AutoBuilder-NoKey-Source/build/libs/*.jar
